<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Emergency Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #0078D4;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }

        button:hover {
            background: #005a9e;
        }

        #mainSection {
            display: none;
        }

        #results {
            margin-top: 25px;
            text-align: left;
        }

        .location {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f9f9f9;
        }

        .location strong {
            font-size: 18px;
        }

        .location a {
            color: #0078D4;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>


<body>

    <h1>🏥 Medical Emergency Information</h1>


    <!-- LOGIN -->
    <div id="loginSection">

        <p>Enter Company Access Code</p>

        <input
            type="password"
            id="password"
            placeholder="Access Code"
        >

        <button onclick="login()">
            Continue
        </button>

    </div>


    <!-- MAIN PAGE -->
    <div id="mainSection">

        <h2>Welcome</h2>


        <!-- LOCATION BUTTON -->
        <button onclick="getLocation()">
            📍 Use My Location
        </button>


        <br><br>


        <!-- TOWN -->
        <select id="townSelect">

            <option value="">
                Select Town
            </option>

            <option value="Bloomfield">
                Bloomfield
            </option>

            <option value="Hartford">
                Hartford
            </option>

            <option value="Manchester">
                Manchester
            </option>

            <option value="New Britain">
                New Britain
            </option>

        </select>


        <!-- RESULTS -->
        <div id="results"></div>

    </div>


    <!-- LOAD LOCATIONS DATA -->
    <!-- THIS MUST ONLY APPEAR ONCE -->
    <script src="locations.js"></script>


    <script>

        // =========================
        // LOGIN
        // =========================

        function login() {

            const password =
                document.getElementById("password").value;


            if (password === "EC2026") {

                document.getElementById("loginSection").style.display =
                    "none";

                document.getElementById("mainSection").style.display =
                    "block";

            }

            else {

                alert("Invalid Access Code");

            }

        }



        // =========================
        // SHOW LOCATIONS BY TOWN
        // =========================

        document
            .getElementById("townSelect")
            .addEventListener("change", function () {


                const selectedTown = this.value;

                const resultsDiv =
                    document.getElementById("results");


                // Nothing selected

                if (selectedTown === "") {

                    resultsDiv.innerHTML = "";

                    return;

                }


                // Make sure locations.js loaded

                if (typeof locations === "undefined") {

                    resultsDiv.innerHTML = `
                        <p class="error">
                            ERROR: locations.js was not loaded.
                        </p>
                    `;

                    return;

                }


                // Find locations for selected town

                const townLocations =
                    locations.filter(function(location) {

                        return location.town.trim().toLowerCase()
                            === selectedTown.trim().toLowerCase();

                    });


                // Heading

                let html =
                    `<h3>📍 Locations in ${selectedTown}</h3>`;


                // No locations

                if (townLocations.length === 0) {

                    html += `
                        <p>
                            No locations found in ${selectedTown}.
                        </p>
                    `;

                }


                // Display locations

                townLocations.forEach(function(location) {

                    html += `

                        <div class="location">

                            <strong>
                                ${location.name}
                            </strong>

                            <br><br>

                            🏥 ${location.type}

                            <br>

                            📍 ${location.town}

                            <br>

                            📞 ${location.phone}

                            <br><br>

                            <a
                                href="${location.website}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                🌐 Open Website
                            </a>

                        </div>

                    `;

                });


                resultsDiv.innerHTML = html;

            });



        // =========================
        // USE MY LOCATION
        // =========================

        function getLocation() {


            if (!navigator.geolocation) {

                alert(
                    "Your browser does not support location services."
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                function(position) {


                    const userLat =
                        position.coords.latitude;

                    const userLon =
                        position.coords.longitude;


                    if (typeof locations === "undefined") {

                        document.getElementById("results").innerHTML = `
                            <p class="error">
                                ERROR: locations.js was not loaded.
                            </p>
                        `;

                        return;

                    }


                    const results = [];


                    locations.forEach(function(location) {


                        const distance = Math.sqrt(

                            Math.pow(
                                userLat - location.latitude,
                                2
                            )

                            +

                            Math.pow(
                                userLon - location.longitude,
                                2
                            )

                        );


                        results.push({

                            ...location,

                            distance: distance

                        });

                    });


                    // Sort closest first

                    results.sort(function(a, b) {

                        return a.distance - b.distance;

                    });


                    // Get 3 closest

                    const nearest =
                        results.slice(0, 3);


                    let html =
                        "<h3>📍 Closest Locations</h3>";


                    nearest.forEach(function(location) {


                        html += `

                            <div class="location">

                                <strong>
                                    ${location.name}
                                </strong>

                                <br><br>

                                🏥 ${location.type}

                                <br>

                                📍 ${location.town}

                                <br>

                                📞 ${location.phone}

                                <br><br>

                                <a
                                    href="${location.website}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    🌐 Open Website
                                </a>

                            </div>

                        `;

                    });


                    document.getElementById("results").innerHTML =
                        html;


                },


                function(error) {

                    alert(
                        "Unable to get your location. " +
                        "Please allow location access."
                    );

                }

            );

        }

    </script>

</body>

</html>
