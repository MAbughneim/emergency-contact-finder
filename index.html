<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Emergency Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #222;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #0078D4;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background: #005a9e;
        }

        #mainSection {
            display: none;
        }

        #results {
            margin-top: 25px;
            text-align: left;
        }

        .location {
            margin-bottom: 20px;
            padding: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f8f8f8;
        }

        .location strong {
            font-size: 18px;
        }

        .location a {
            color: #0078D4;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>


<body>

    <h1>🏥 Medical Emergency Information</h1>


    <!-- LOGIN -->

    <div id="loginSection">

        <p>Enter Company Access Code</p>

        <input
            type="password"
            id="password"
            placeholder="Access Code"
        >

        <button onclick="login()">
            Continue
        </button>

    </div>


    <!-- MAIN -->

    <div id="mainSection">

        <h2>Welcome</h2>

        <button onclick="getLocation()">
            📍 Use My Location
        </button>

        <br><br>


        <!-- TOWN DROPDOWN -->

        <select id="townSelect">

            <option value="">
                Select Town
            </option>

        </select>


        <!-- RESULTS -->

        <div id="results"></div>

    </div>


    <!-- LOAD LOCATIONS.JS ONCE -->

    <script src="locations.js"></script>


    <script>

        // =====================================
        // LOGIN
        // =====================================

        function login() {

            const password =
                document.getElementById("password").value;

            if (password === "EC2026") {

                document.getElementById("loginSection").style.display =
                    "none";

                document.getElementById("mainSection").style.display =
                    "block";

            } else {

                alert("Invalid Access Code");

            }

        }


        // =====================================
        // CHECK LOCATIONS FILE
        // =====================================

        if (typeof locations === "undefined") {

            document.getElementById("results").innerHTML =
                "<p class='error'>ERROR: locations.js was not loaded.</p>";

        }


        // =====================================
        // CREATE TOWN DROPDOWN
        // =====================================

        const townSelect =
            document.getElementById("townSelect");


        if (typeof locations !== "undefined") {

            const towns = [
                ...new Set(
                    locations.map(function(location) {
                        return location.town;
                    })
                )
            ].sort();


            towns.forEach(function(town) {

                const option =
                    document.createElement("option");

                option.value = town;

                option.textContent = town;

                townSelect.appendChild(option);

            });

        }


        // =====================================
        // TOWN SELECTED
        // =====================================

        townSelect.addEventListener("change", function() {

            const selectedTown = this.value;

            const results =
                document.getElementById("results");


            if (selectedTown === "") {

                results.innerHTML = "";

                return;

            }


            if (typeof locations === "undefined") {

                results.innerHTML =
                    "<p class='error'>locations.js is not loaded.</p>";

                return;

            }


            // FIND ALL LOCATIONS IN TOWN

            const townLocations =
                locations.filter(function(location) {

                    return location.town.toLowerCase() ===
                           selectedTown.toLowerCase();

                });


            let html =
                "<h3>📍 Locations in " +
                selectedTown +
                "</h3>";


            if (townLocations.length === 0) {

                html +=
                    "<p>No locations found.</p>";

            }


            // DISPLAY EVERY LOCATION

            townLocations.forEach(function(location) {

                html += `

                    <div class="location">

                        <strong>
                            ${location.name}
                        </strong>

                        <br><br>

                        🏥 ${location.type}

                        <br><br>

                        📍 ${location.address}

                        <br><br>

                        📞
                        <a href="tel:${location.phone}">
                            ${location.phone}
                        </a>

                        <br><br>

                        <a
                            href="${location.website}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            🌐 Open Website
                        </a>

                    </div>

                `;

            });


            results.innerHTML = html;

        });


        // =====================================
        // USE MY LOCATION
        // =====================================

        function getLocation() {

            if (!navigator.geolocation) {

                alert(
                    "Your browser does not support location services."
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const userLat =
                        position.coords.latitude;

                    const userLon =
                        position.coords.longitude;


                    if (typeof locations === "undefined") {

                        document.getElementById("results").innerHTML =
                            "<p class='error'>locations.js is not loaded.</p>";

                        return;

                    }


                    // CALCULATE DISTANCE

                    const results =
                        locations.map(function(location) {

                            const distance =
                                Math.sqrt(

                                    Math.pow(
                                        userLat -
                                        location.latitude,
                                        2
                                    )

                                    +

                                    Math.pow(
                                        userLon -
                                        location.longitude,
                                        2
                                    )

                                );


                            return {

                                ...location,

                                distance: distance

                            };

                        });


                    // SORT CLOSEST FIRST

                    results.sort(function(a, b) {

                        return a.distance - b.distance;

                    });


                    // 2 CLOSEST URGENT CARE

                    const urgentCares =
                        results
                        .filter(function(location) {

                            return location.type === "Urgent Care";

                        })
                        .slice(0, 2);


                    // 2 CLOSEST EMERGENCY ROOMS

                    const emergencyRooms =
                        results
                        .filter(function(location) {

                            return location.type === "Emergency Room";

                        })
                        .slice(0, 2);


                    const nearest = [
                        ...urgentCares,
                        ...emergencyRooms
                    ];


                    let html =
                        "<h3>📍 Closest Locations</h3>";


                    nearest.forEach(function(location) {

                        html += `

                            <div class="location">

                                <strong>
                                    ${location.name}
                                </strong>

                                <br><br>

                                🏥 ${location.type}

                                <br><br>

                                📍 ${location.address}

                                <br><br>

                                📞
                                <a href="tel:${location.phone}">
                                    ${location.phone}
                                </a>

                                <br><br>

                                <a
                                    href="${location.website}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    🌐 Open Website
                                </a>

                            </div>

                        `;

                    });


                    document.getElementById("results").innerHTML =
                        html;

                },


                function() {

                    alert(
                        "Unable to get your location. " +
                        "Please allow location access."
                    );

                }

            );

        }

    </script>

</body>

</html>
