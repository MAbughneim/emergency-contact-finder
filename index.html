<!DOCTYPE html>
<html>
<head>
    <title>Medical Emergency Information</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #0078D4;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #005a9e;
        }

        #mainSection {
            display: none;
        }

        .location {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <h1>🏥 Medical Emergency Information</h1>

    <div id="loginSection">

        <p>Enter Company Access Code</p>

        <input
            type="password"
            id="password"
            placeholder="Access Code"
        >

        <button onclick="login()">Continue</button>

    </div>

    <div id="mainSection">

        <h2>Welcome</h2>

        <button onclick="getLocation()">📍 Use My Location</button>

        <br><br>

        <select id="townSelect">
            <option value="">Select Town</option>
            <option value="Bloomfield">Bloomfield</option>
            <option value="Hartford">Hartford</option>
            <option value="Manchester">Manchester</option>
            <option value="New Britain">New Britain</option>
        </select>

        <div id="results"></div>

    </div>

    <!-- Your locations.js file -->
    <script src="locations.js"></script>

    <script>

        function login() {

            const password =
                document.getElementById("password").value;

            if (password === "EC2026") {

                document.getElementById("loginSection").style.display = "none";

                document.getElementById("mainSection").style.display = "block";

            } else {

                alert("Invalid Access Code");

            }
        }


        function getLocation() {

            if (!navigator.geolocation) {

                alert("Your browser does not support location services.");
                return;

            }

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const userLat = position.coords.latitude;
                    const userLon = position.coords.longitude;

                    const results = [];

                    locations.forEach(function(location) {

                        const distance =
                            Math.sqrt(
                                Math.pow(
                                    userLat - location.latitude,
                                    2
                                ) +
                                Math.pow(
                                    userLon - location.longitude,
                                    2
                                )
                            );

                        results.push({
                            ...location,
                            distance: distance
                        });

                    });


                    results.sort(function(a, b) {
                        return a.distance - b.distance;
                    });


                    const nearest = results.slice(0, 3);

                    let html = "<h3>Closest Locations</h3>";


                    nearest.forEach(function(location) {

                        html += `
                            <div class="location">

                                <strong>${location.name}</strong>
                                <br>

                                ${location.type}
                                <br>

                                ${location.town}
                                <br>

                                📞 ${location.phone}
                                <br><br>

                                <a
                                    href="${location.website}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    🌐 Open Website
                                </a>

                            </div>
                        `;

                    });


                    document.getElementById("results").innerHTML = html;

                },

                function(error) {

                    alert(
                        "Unable to get your location. " +
                        "Please allow location access."
                    );

                }

            );

        }

        document.getElementById("townSelect").addEventListener("change", function () {

    const selectedTown = this.value;

    if (!selectedTown) {
        document.getElementById("results").innerHTML = "";
        return;
    }

    const townLocations = locations.filter(function (location) {
        return location.town === selectedTown;
    });

    let html = `<h3>Locations in ${selectedTown}</h3>`;

    if (townLocations.length === 0) {
        html += `<p>No locations found for ${selectedTown}.</p>`;
    } else {

        townLocations.forEach(function (location) {

            html += `
                <div class="location">
                    <strong>${location.name}</strong><br>
                    ${location.type}<br>
                    📍 ${location.town}<br>
                    📞 ${location.phone}<br><br>

                    <a href="${location.website}"
                       target="_blank"
                       rel="noopener noreferrer">
                        🌐 Open Website
                    </a>
                </div>
            `;

        });
    }

    document.getElementById("results").innerHTML = html;

});

</script>

<script src="locations.js"></script>

</body>
</html>
