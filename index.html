<body>

<h1>🏥 Medical Emergency Information</h1>

<div id="loginSection">

    <p>Enter Company Access Code</p>

    <input type="password" id="password">

    <button onclick="login()">Continue</button>

</div>

<div id="mainSection">

    <h2>Welcome</h2>

    <button onclick="getLocation()">Use My Location</button>

    <br><br>

    <select>
        <option>Select Town</option>
        <option>Bloomfield</option>
        <option>Hartford</option>
        <option>Manchester</option>
        <option>New Britain</option>
    </select>

    <div id="results"></div>

</div>

<script>

function login(){

    const password = document.getElementById("password").value;

    if(password === "EC2026"){
        document.getElementById("loginSection").style.display="none";
        document.getElementById("mainSection").style.display="block";
    }
    else{
        alert("Invalid Access Code");
    }
}

function getLocation() {

    navigator.geolocation.getCurrentPosition(function(position) {

        const userLat = position.coords.latitude;
        const userLon = position.coords.longitude;

        const results = [];

        locations.forEach(function(location) {

            const distance =
                Math.sqrt(
                    Math.pow(userLat - location.latitude, 2) +
                    Math.pow(userLon - location.longitude, 2)
                );

            results.push({
                ...location,
                distance: distance
            });

        });

        results.sort((a, b) => a.distance - b.distance);

        const nearest = results.slice(0, 3);

        let html = "<h3>Closest Locations</h3>";

        nearest.forEach(function(location) {

            html += `
                <div style="margin-bottom:20px;padding:10px;border:1px solid #ccc;">
                    <strong>${location.name}</strong><br>
                    ${location.type}<br>
                    ${location.town}<br>
                    📞 ${location.phone}<br>
                    ${location.website}Open Website</a>
                </div>
            `;
        });

        document.getElementById("results").innerHTML = html;

    });

}

</script>
