<!DOCTYPE html>
<html>
<head>
    <title>Medical Emergency Information</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align:center;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
        }

        button{
            background:#0078D4;
            color:white;
            border:none;
            padding:12px 20px;
            cursor:pointer;
            border-radius:4px;
        }

        #mainSection{
            display:none;
        }
    </style>
</head>

<body>

<h1>🏥 Medical Emergency Information</h1>

<div id="loginSection">

    <p>Enter Company Access Code</p>

    <input type="password" id="password">

    <button onclick="login()">Continue</button>

</div>

<div id="mainSection">

    <h2>Welcome</h2>

    <button onclick="getLocation()">Use My Location</button>

    <br><br>

    <select>
        <option>Select Town</option>
        <option>Bloomfield</option>
        <option>Hartford</option>
        <option>Manchester</option>
        <option>New Britain</option>
    </select>

    <div id="results"></div>

</div>

<script>

function login(){

    const password = document.getElementById("password").value;

    if(password === "EC2026"){
        document.getElementById("loginSection").style.display="none";
        document.getElementById("mainSection").style.display="block";
    }
    else{
        alert("Invalid Access Code");
    }
}

async function getLocation() {

    navigator.geolocation.getCurrentPosition(async function(position) {

        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        document.getElementById("results").innerHTML =
            "<h3>Searching...</h3>";

        try {

           const response = await fetch("https://default4d4ab0e0600f4fccab3ed1849682f0.6f.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/29/workflows/21d81b57dac94e4699080d67eafc6975/triggers/manual/paths/invoke?api-version=1", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
  
                    latitude: latitude,
                    longitude: longitude
                })
            });

            const data = await response.text();

            document.getElementById("results").innerHTML =
                "<h3>Flow Response</h3><p>" + data + "</p>";

        }
        catch(error) {

            document.getElementById("results").innerHTML =
                "<h3>Error</h3><p>" + error + "</p>";

        }

    });

}

</script>

</body>
</html>
