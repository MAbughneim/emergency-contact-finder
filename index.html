<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Emergency Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #222;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #0078D4;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background: #005a9e;
        }

        #mainSection {
            display: none;
        }

        #results {
            margin-top: 25px;
            text-align: left;
        }

        .location {
            margin-bottom: 20px;
            padding: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f8f8f8;
        }

        .location strong {
            font-size: 18px;
        }

        .location a {
            color: #0078D4;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>


<body>

    <h1>🏥 Medical Emergency Information</h1>


    <!-- LOGIN -->

    <div id="loginSection">

        <p>Enter Company Access Code</p>

        <input
            type="password"
            id="password"
            placeholder="Access Code"
        >

        <button onclick="login()">
            Continue
        </button>

    </div>


    <!-- MAIN -->

    <div id="mainSection">

        <h2>Welcome</h2>

        <button onclick="getLocation()">
            📍 Use My Location
        </button>

        <br><br>


        <!-- TOWN DROPDOWN -->

        <select id="townSelect">

            <option value="">
                Select Town
            </option>

        </select>


        <!-- RESULTS -->

        <div id="results"></div>

    </div>


    <!-- LOAD LOCATIONS.JS ONCE -->

    <script src="locations.js"></script>


    <script>

        // =====================================
        // LOGIN
        // =====================================

        function login() {

            const password =
                document.getElementById("password").value;

            if (password === "EC2026") {

                document.getElementById("loginSection").style.display =
                    "none";

                document.getElementById("mainSection").style.display =
                    "block";

            } else {

                alert("Invalid Access Code");

            }

        }


        // =====================================
        // CHECK LOCATIONS FILE
        // =====================================

        if (typeof locations === "undefined") {

            document.getElementById("results").innerHTML =
                "<p class='error'>ERROR: locations.js was not loaded.</p>";

        }


        // =====================================
        // CREATE TOWN DROPDOWN
        // =====================================

        const townSelect =
            document.getElementById("townSelect");


        if (typeof locations !== "undefined") {

            const towns = [
                ...new Set(
                    locations.map(function(location) {
                        return location.town;
                    })
                )
            ].sort();


            towns.forEach(function(town) {

                const option =
                    document.createElement("option");

                option.value = town;

                option.textContent = town;

                townSelect.appendChild(option);

            });

        }


        // =====================================
        // TOWN SELECTED
        // =====================================

        townSelect.addEventListener("change", function() {

            const selectedTown = this.value;

            const results =
                document.getElementById("results");


            if (selectedTown === "") {

                results.innerHTML = "";

                return;

            }


            if (typeof locations === "undefined") {

                results.innerHTML =
                    "<p class='error'>locations.js is not loaded.</p>";

                return;

            }


            // FIND ALL LOCATIONS IN TOWN

            const townLocations =
                locations.filter(function(location) {

                    return location.town.toLowerCase() ===
                           selectedTown.toLowerCase();

                });


            let html =
                "<h3>📍 Locations in " +
                selectedTown +
                "</h3>";


            if (townLocations.length === 0) {

                html +=
                    "<p>No locations found.</p>";

            }


            // DISPLAY EVERY LOCATION

            townLocations.forEach(function(location) {

                html += `

                    <div class="location">

                        <strong>
                            ${location.name}
                        </strong>

                        <br><br>

                        🏥 ${location.type}

                        <br><br>

                        📍 ${location.address}

                        <br><br>

                        📞
                        <a href="tel:${location.phone}">
                            ${location.phone}
                        </a>

                        <br><br>

                        <a
                            href="${location.website}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            🌐 Open Website
                        </a>

                    </div>

                `;

            });


            results.innerHTML = html;

        });


        // =====================================
        // USE MY LOCATION
        // =====================================

 function getLocation() {

    const resultsDiv = document.getElementById("results");

    // Check browser support
    if (!navigator.geolocation) {

        resultsDiv.innerHTML = `
            <p class="error">
                Your browser does not support location services.
            </p>
        `;

        return;
    }

    // Show loading message
    resultsDiv.innerHTML = `
        <h3>📍 Finding locations near you...</h3>
        <p>Please wait...</p>
    `;


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;


            // Make sure locations.js loaded

            if (
                typeof locations === "undefined" ||
                !Array.isArray(locations) ||
                locations.length === 0
            ) {

                resultsDiv.innerHTML = `
                    <p class="error">
                        No location data was found.
                    </p>
                `;

                return;
            }


            // Calculate distance from user to every location

            const results = locations.map(function(location) {

                const lat1 =
                    userLat * Math.PI / 180;

                const lat2 =
                    location.latitude * Math.PI / 180;

                const dLat =
                    (location.latitude - userLat)
                    * Math.PI / 180;

                const dLon =
                    (location.longitude - userLon)
                    * Math.PI / 180;


                // Haversine distance

                const a =
                    Math.sin(dLat / 2) *
                    Math.sin(dLat / 2) +

                    Math.cos(lat1) *
                    Math.cos(lat2) *
                    Math.sin(dLon / 2) *
                    Math.sin(dLon / 2);


                const c =
                    2 * Math.atan2(
                        Math.sqrt(a),
                        Math.sqrt(1 - a)
                    );


                const distance =
                    3958.8 * c; // miles


                return {
                    ...location,
                    distance: distance
                };

            });


            // ==============================
            // CLOSEST URGENT CARE
            // ==============================

            const urgentCares =
                results
                    .filter(function(location) {
                        return location.type === "Urgent Care";
                    })
                    .sort(function(a, b) {
                        return a.distance - b.distance;
                    })
                    .slice(0, 2);


            // ==============================
            // CLOSEST EMERGENCY ROOMS
            // ==============================

            const emergencyRooms =
                results
                    .filter(function(location) {
                        return location.type === "Emergency Room";
                    })
                    .sort(function(a, b) {
                        return a.distance - b.distance;
                    })
                    .slice(0, 2);


            // ==============================
            // COMBINE RESULTS
            // ==============================

            const nearest = [
                ...urgentCares,
                ...emergencyRooms
            ];


            // ==============================
            // DISPLAY RESULTS
            // ==============================

            let html = `
                <h3>📍 Closest Medical Locations</h3>
            `;


            if (nearest.length === 0) {

                html += `
                    <p>
                        No medical locations were found.
                    </p>
                `;

            }


            // Display each location

            nearest.forEach(function(location) {

                html += `

                    <div class="location">

                        <strong>
                            ${location.name}
                        </strong>

                        <br><br>

                        🏥 ${location.type}

                        <br><br>

                        📍 ${location.address}

                        <br><br>

                        📏
                        ${location.distance.toFixed(1)}
                        miles away

                        <br><br>

                        📞
                        <a href="tel:${location.phone}">
                            ${location.phone}
                        </a>

                        <br><br>

                        <a
                            href="${location.website}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            🌐 Open Website
                        </a>

                    </div>

                `;

            });


            resultsDiv.innerHTML = html;

        },


        function(error) {

            let message =
                "Unable to get your location.";

            if (error.code === 1) {

                message =
                    "Location permission was denied. " +
                    "Please allow location access in your browser.";

            }

            else if (error.code === 2) {

                message =
                    "Your location could not be determined.";

            }

            else if (error.code === 3) {

                message =
                    "Location request timed out. Please try again.";

            }


            resultsDiv.innerHTML = `
                <p class="error">
                    ${message}
                </p>
            `;

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


    </script>

</body>

</html>
