<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nearby Urgent Care & Emergency Rooms</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 24px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            opacity: 0.95;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 25px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: #0b5ed7;
        }

        button:hover {
            background: #084db2;
        }

        button.emergency {
            background: #dc3545;
        }

        button.emergency:hover {
            background: #b02a37;
        }

        button.urgent {
            background: #198754;
        }

        button.urgent:hover {
            background: #146c43;
        }

        .status {
            text-align: center;
            margin: 15px 0;
            color: #555;
            min-height: 24px;
        }

        .location-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            display: none;
        }

        .location-card.show {
            display: block;
        }

        .location-type {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
            background: #e7f1ff;
            color: #0b5ed7;
        }

        .location-type.emergency {
            background: #fde8ea;
            color: #dc3545;
        }

        .location-type.urgent {
            background: #e8f7ef;
            color: #198754;
        }

        .location-card h2 {
            margin: 5px 0 15px;
            font-size: 24px;
        }

        .info {
            margin: 10px 0;
            line-height: 1.5;
        }

        .distance {
            font-size: 18px;
            font-weight: bold;
            color: #0b5ed7;
            margin: 15px 0;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .actions a {
            text-decoration: none;
            padding: 11px 16px;
            border-radius: 7px;
            font-weight: bold;
            color: white;
            background: #0b5ed7;
        }

        .actions a.phone {
            background: #198754;
        }

        .actions a.website {
            background: #6f42c1;
        }

        .error {
            color: #dc3545;
            font-weight: bold;
            text-align: center;
        }

        .all-locations {
            margin-top: 35px;
        }

        .all-locations h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .location-list {
            display: grid;
            gap: 12px;
        }

        .location-item {
            background: white;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .location-item strong {
            display: block;
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .location-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Nearby Urgent Care & Emergency Rooms</h1>
    <p>Find the closest medical location using your GPS location.</p>
</header>

<main>

    <div class="controls">
        <button onclick="getUserLocation()">
            📍 Find Closest Location
        </button>

        <button class="urgent" onclick="getUserLocation('Urgent Care')">
            🩺 Closest Urgent Care
        </button>

        <button class="emergency" onclick="getUserLocation('Emergency Room')">
            🚨 Closest Emergency Room
        </button>
    </div>

    <div id="status" class="status">
        Click a button above to find a nearby location.
    </div>

    <div id="location-card" class="location-card">

        <div id="location-type" class="location-type"></div>

        <h2 id="location-name"></h2>

        <div id="location-address" class="info"></div>

        <div id="location-phone" class="info"></div>

        <div id="location-distance" class="distance"></div>

        <div class="info">
            <strong>Weekdays:</strong>
            <span id="weekday-hours"></span>
        </div>

        <div class="info">
            <strong>Saturday:</strong>
            <span id="saturday-hours"></span>
        </div>

        <div class="info">
            <strong>Sunday:</strong>
            <span id="sunday-hours"></span>
        </div>

        <div class="actions">

            <a
                id="directions-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer">
                🗺️ Get Directions
            </a>

            <a
                id="phone-link"
                class="phone"
                href="#">
                📞 Call
            </a>

            <a
                id="website-link"
                class="website"
                href="#"
                target="_blank"
                rel="noopener noreferrer">
                🌐 Website
            </a>

        </div>

    </div>


    <div class="all-locations">

        <h2>All Locations</h2>

        <div id="location-list" class="location-list"></div>

    </div>

</main>


<script type="module">

    import locations from "./locations.js";


    // ==========================================
    // DISTANCE CALCULATION
    // ==========================================

    function getDistanceInMiles(lat1, lon1, lat2, lon2) {

        const R = 3958.8;

        const dLat =
            (lat2 - lat1) * Math.PI / 180;

        const dLon =
            (lon2 - lon1) * Math.PI / 180;

        const a =
            Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;

        const c =
            2 * Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );

        return R * c;
    }


    // ==========================================
    // FIND CLOSEST LOCATION
    // ==========================================

    function findClosestLocation(
        userLat,
        userLon,
        type = null
    ) {

        let availableLocations = [...locations];

        if (type) {

            availableLocations =
                availableLocations.filter(
                    location =>
                        location.type === type
                );
        }

        if (availableLocations.length === 0) {
            return null;
        }

        const locationsWithDistance =
            availableLocations.map(location => {

                const distance =
                    getDistanceInMiles(
                        userLat,
                        userLon,
                        location.latitude,
                        location.longitude
                    );

                return {
                    ...location,
                    distance
                };

            });

        locationsWithDistance.sort(
            (a, b) =>
                a.distance - b.distance
        );

        return locationsWithDistance[0];
    }


    // ==========================================
    // DISPLAY LOCATION
    // ==========================================

    function displayClosestLocation(location) {

        const card =
            document.getElementById(
                "location-card"
            );

        const typeElement =
            document.getElementById(
                "location-type"
            );

        const nameElement =
            document.getElementById(
                "location-name"
            );

        const addressElement =
            document.getElementById(
                "location-address"
            );

        const phoneElement =
            document.getElementById(
                "location-phone"
            );

        const distanceElement =
            document.getElementById(
                "location-distance"
            );

        const weekdayElement =
            document.getElementById(
                "weekday-hours"
            );

        const saturdayElement =
            document.getElementById(
                "saturday-hours"
            );

        const sundayElement =
            document.getElementById(
                "sunday-hours"
            );

        const directionsLink =
            document.getElementById(
                "directions-link"
            );

        const phoneLink =
            document.getElementById(
                "phone-link"
            );

        const websiteLink =
            document.getElementById(
                "website-link"
            );


        typeElement.textContent =
            location.type;

        typeElement.className =
            "location-type " +
            (
                location.type === "Emergency Room"
                    ? "emergency"
                    : "urgent"
            );


        nameElement.textContent =
            location.name;


        addressElement.textContent =
            "📍 " + location.address;


        phoneElement.textContent =
            "📞 " + location.phone;


        distanceElement.textContent =
            "📏 " +
            location.distance.toFixed(2) +
            " miles away";


        weekdayElement.textContent =
            location.weekdayHours;


        saturdayElement.textContent =
            location.saturdayHours;


        sundayElement.textContent =
            location.sundayHours;


        // Google Maps directions
        directionsLink.href =
            `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(
                location.address
            )}`;


        // Phone
        phoneLink.href =
            `tel:${location.phone.replace(/[^0-9+]/g, "")}`;


        // Website
        websiteLink.href =
            location.website;


        card.classList.add("show");
    }


    // ==========================================
    // GET USER GPS LOCATION
    // ==========================================

    function getUserLocation(type = null) {

        const status =
            document.getElementById(
                "status"
            );

        status.textContent =
            "📍 Getting your location...";


        if (!navigator.geolocation) {

            status.innerHTML =
                '<span class="error">' +
                'Geolocation is not supported by your browser.' +
                '</span>';

            return;
        }


        navigator.geolocation.getCurrentPosition(

            function(position) {

                const userLat =
                    position.coords.latitude;

                const userLon =
                    position.coords.longitude;


                console.log(
                    "User latitude:",
                    userLat
                );

                console.log(
                    "User longitude:",
                    userLon
                );


                const closest =
                    findClosestLocation(
                        userLat,
                        userLon,
                        type
                    );


                if (!closest) {

                    status.innerHTML =
                        '<span class="error">' +
                        'No matching locations found.' +
                        '</span>';

                    return;
                }


                displayClosestLocation(
                    closest
                );


                status.textContent =
                    "✅ Closest location found.";


                console.log(
                    "Closest:",
                    closest.name
                );

                console.log(
                    "Distance:",
                    closest.distance.toFixed(2),
                    "miles"
                );

            },


            function(error) {

                let message =
                    "Unable to get your location.";

                if (error.code === 1) {
                    message =
                        "Location permission was denied. Please allow location access.";
                }

                if (error.code === 2) {
                    message =
                        "Your location could not be determined.";
                }

                if (error.code === 3) {
                    message =
                        "Location request timed out.";
                }


                status.innerHTML =
                    '<span class="error">' +
                    message +
                    '</span>';

                console.error(
                    "Geolocation error:",
                    error
                );
            },


            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }


    // ==========================================
    // SHOW ALL LOCATIONS
    // ==========================================

    function displayAllLocations() {

        const list =
            document.getElementById(
                "location-list"
            );

        list.innerHTML = "";


        locations.forEach(location => {

            const item =
                document.createElement("div");

            item.className =
                "location-item";


            item.innerHTML = `
                <strong>${location.name}</strong>
                <span>${location.type}</span><br>
                <span>📍 ${location.address}</span><br>
                <span>📞 ${location.phone}</span>
            `;


            list.appendChild(item);
        });
    }


    // ==========================================
    // INITIALIZE
    // ==========================================

    displayAllLocations();


    // Make function available to buttons
    window.getUserLocation =
        getUserLocation;

</script>

</body>
</html>
