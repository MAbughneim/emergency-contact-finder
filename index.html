<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Emergency Information</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 50px;
            text-align: center;
            background: linear-gradient(
                135deg,
                #eef6ff 0%,
                #f8fbff 50%,
                #eef8f4 100%
            );
            color: #222;
            min-height: 100vh;
        }

        .page-container {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 12px 40px rgba(0, 65, 120, 0.12);
            border: 1px solid rgba(0, 120, 212, 0.08);
        }

        .header {
            margin-bottom: 30px;
        }

        .header-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e63946, #c1121f);
            color: white;
            border-radius: 50%;
            font-size: 36px;
            box-shadow: 0 8px 20px rgba(198, 18, 31, 0.25);
        }

        h1 {
            color: #16324f;
            margin: 0 0 10px;
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.15;
            font-weight: 800;
        }

        h2 {
            color: #506070;
            margin: 0;
            font-size: 19px;
            font-weight: 500;
        }

        h3 {
            color: #16324f;
            margin: 30px 0 18px;
            font-size: 24px;
        }

        h4 {
            color: #0078D4;
            margin: 25px 0 12px;
            font-size: 19px;
            text-align: left;
        }

        p {
            color: #5b6875;
            line-height: 1.6;
        }

        .intro-text {
            background: #f3f8fc;
            border-left: 4px solid #0078D4;
            padding: 14px 18px;
            border-radius: 10px;
            margin: 25px 0;
            text-align: left;
        }

        input,
        select {
            width: 100%;
            padding: 15px 16px;
            margin: 10px 0;
            border: 1px solid #cbd7e2;
            border-radius: 10px;
            background: white;
            font-size: 16px;
            color: #263746;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #0078D4;
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.12);
        }

        select {
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, #0078D4, #005fa8);
            color: white;
            border: none;
            padding: 14px 22px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 5px 14px rgba(0, 120, 212, 0.22);
            transition: all 0.2s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #006bc0, #004f8c);
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(0, 120, 212, 0.28);
        }

        button:active {
            transform: translateY(0);
        }

        .location-button {
            width: 100%;
            max-width: 400px;
            font-size: 17px;
            padding: 16px 20px;
        }

        .safety-button {
            background: linear-gradient(135deg, #198754, #126c42);
            width: 100%;
            max-width: 400px;
            font-size: 17px;
            padding: 16px 20px;
            box-shadow: 0 5px 14px rgba(25, 135, 84, 0.22);
        }

        .safety-button:hover {
            background: linear-gradient(135deg, #157347, #0d5834);
        }

        #results {
            margin-top: 30px;
            text-align: left;
        }

        #results > h3 {
            text-align: center;
        }

        .location {
            margin-bottom: 20px;
            padding: 22px;
            border: 1px solid #dce5ed;
            border-radius: 15px;
            background: #ffffff;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .location::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(180deg, #0078D4, #00a6fb);
        }

        .location:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
        }

        .location strong {
            display: block;
            font-size: 20px;
            color: #16324f;
            margin-bottom: 4px;
        }

        .location a {
            color: #0078D4;
            font-weight: 600;
            text-decoration: none;
        }

        .location a:hover {
            text-decoration: underline;
        }

        .location hr {
            border: none;
            border-top: 1px solid #e4e9ee;
            margin: 16px 0;
        }

        .info-row {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 12px 0;
            line-height: 1.5;
        }

        .info-icon {
            min-width: 24px;
        }

        .safety-card::before {
            background: linear-gradient(180deg, #198754, #20a866);
        }

        .pdf-button {
            background: #f4f8fb;
            color: #16324f;
            border: 1px solid #d6e1ea;
            box-shadow: none;
            text-align: left;
            width: 100%;
        }

        .pdf-button:hover {
            background: #eaf4fb;
            color: #0078D4;
            border-color: #b9d8ee;
        }

        .error {
            color: #b42318;
            font-weight: bold;
            background: #fff1f0;
            border: 1px solid #f5c2c0;
            border-left: 5px solid #dc3545;
            border-radius: 10px;
            padding: 16px;
        }

        .loading {
            text-align: center;
            padding: 25px;
            background: #f4f9fd;
            border-radius: 12px;
            color: #506070;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8ee;
            color: #7a8793;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px 10px 30px;
            }

            .page-container {
                padding: 22px 16px;
                border-radius: 16px;
            }

            h1 {
                font-size: 29px;
            }

            h2 {
                font-size: 17px;
            }

            .header-icon {
                width: 62px;
                height: 62px;
                font-size: 30px;
            }

            .location {
                padding: 18px;
            }

            .location strong {
                font-size: 18px;
            }
        }

    </style>
</head>


<body>

<div class="page-container">

    <div class="header">

        <div class="header-icon">
            🚨
        </div>

        <h1>
            Custom Electric Emergency & Safety Information
        </h1>

        <h2>
            Medical Facilities, Safety Resources & SDS Documents
        </h2>

    </div>


    <div id="mainSection">

        <div class="intro-text">

            <p>
                <strong>📍 Find emergency resources near you</strong><br>
                Use your location or select a town below.
            </p>

        </div>


        <button
            class="location-button"
            onclick="getLocation()"
        >
            📍 Use My Location
        </button>


        <br><br>


        <select id="townSelect">

            <option value="">
                Select Town
            </option>

        </select>


        <br><br>


        <button
            class="safety-button"
            onclick="showSafety()"
        >
            🦺 Safety Information
        </button>


        <br><br>


        <div id="results"></div>

    </div>


    <div class="footer">
        Custom Electric • Emergency & Safety Information
    </div>

</div>


<script src="locations.js"></script>


<script>

/* =====================================================
   CHECK LOCATIONS
===================================================== */

if (typeof locations === "undefined") {

    document.getElementById("results").innerHTML =
        "<p class='error'>ERROR: locations.js was not loaded.</p>";

}


/* =====================================================
   TOWN DROPDOWN
===================================================== */

const townSelect =
    document.getElementById("townSelect");


if (typeof locations !== "undefined") {

    const towns = [
        ...new Set(
            locations.map(function(location) {
                return location.town;
            })
        )
    ].sort();


    towns.forEach(function(town) {

        const option =
            document.createElement("option");

        option.value = town;

        option.textContent = town;

        townSelect.appendChild(option);

    });

}


/* =====================================================
   CURRENT USER LOCATION
===================================================== */

let userLocation = null;


/* =====================================================
   GOOGLE MAPS LINK
   Uses the user's GPS position as the starting point
   and the actual location ADDRESS as destination.
===================================================== */

function googleMapsLink(location) {

    const destination =
        encodeURIComponent(location.address);


    if (userLocation) {

        return `https://www.google.com/maps/dir/?api=1&origin=${userLocation.lat},${userLocation.lon}&destination=${destination}&travelmode=driving`;

    }


    return `https://www.google.com/maps/search/?api=1&query=${destination}`;

}


/* =====================================================
   APPLE MAPS LINK
   Uses the user's GPS position as the starting point
   and the actual location ADDRESS as destination.
===================================================== */

function appleMapsLink(location) {

    const destination =
        encodeURIComponent(location.address);


    if (userLocation) {

        return `https://maps.apple.com/?saddr=${userLocation.lat},${userLocation.lon}&daddr=${destination}&dirflg=d`;

    }


    return `https://maps.apple.com/?address=${destination}`;

}


/* =====================================================
   CREATE LOCATION CARD
   Used by the town selector.
===================================================== */

function createLocationCard(location) {

    return `

        <div class="location">

            <strong>
                ${location.name}
            </strong>


            <div class="info-row">

                <span class="info-icon">
                    🏥
                </span>

                <span>
                    ${location.type}
                </span>

            </div>


            <div class="info-row">

                <span class="info-icon">
                    📍
                </span>

                <div>

                    <strong style="font-size:14px;">
                        ${location.address}
                    </strong>


                    <br><br>


                    <a
                        href="${googleMapsLink(location)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🗺️ Google Maps
                    </a>

                    &nbsp; | &nbsp;

                    <a
                        href="${appleMapsLink(location)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🍎 Apple Maps
                    </a>

                </div>

            </div>


            <hr>


            <div class="info-row">

                <span class="info-icon">
                    🕒
                </span>

                <span>

                    <strong style="font-size:14px;">
                        Mon-Fri:
                    </strong>

                    ${location.weekdayHours || "Not Available"}

                </span>

            </div>


            <div class="info-row">

                <span class="info-icon">
                    🕒
                </span>

                <span>

                    <strong style="font-size:14px;">
                        Saturday:
                    </strong>

                    ${location.saturdayHours || "Not Available"}

                </span>

            </div>


            <div class="info-row">

                <span class="info-icon">
                    🕒
                </span>

                <span>

                    <strong style="font-size:14px;">
                        Sunday:
                    </strong>

                    ${location.sundayHours || "Not Available"}

                </span>

            </div>


            <hr>


            <div class="info-row">

                <span class="info-icon">
                    📞
                </span>

                <span>

                    <a href="tel:${location.phone}">
                        ${location.phone}
                    </a>

                </span>

            </div>


            <div class="info-row">

                <span class="info-icon">
                    🌐
                </span>

                <span>

                    <a
                        href="${location.website}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Open Website
                    </a>

                </span>

            </div>

        </div>

    `;

}


/* =====================================================
   CREATE LOCATION CARD WITH DISTANCE
   Used by "Use My Location".
===================================================== */

function createLocationCardWithDistance(location) {

    return `

        <div class="location">

            <strong>
                ${location.name}
            </strong>


            <div
                style="
                    color:#198754;
                    font-weight:700;
                    margin:8px 0 15px;
                "
            >
                📍 ${location.distance.toFixed(1)} miles away
            </div>


            <div class="info-row">

                <span class="info-icon">
                    🏥
                </span>

                <span>
                    ${location.type}
                </span>

            </div>


            <div class="info-row">

                <span class="info-icon">
                    📍
                </span>

                <div>

                    <strong style="font-size:14px;">
                        ${location.address}
                    </strong>


                    <br><br>


                    <a
                        href="${googleMapsLink(location)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🗺️ Google Maps
                    </a>

                    &nbsp; | &nbsp;

                    <a
                        href="${appleMapsLink(location)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🍎 Apple Maps
                    </a>

                </div>

            </div>


            <hr>


            <div class="info-row">

                <span class="info-icon">
                    🕒
                </span>

                <span>

                    <strong style="font-size:14px;">
                        Mon-Fri:
                    </strong>

                    ${location.weekdayHours || "Not Available"}

                </span>

            </div>


            <div class="info-row">

                <span class="info-icon">
                    🕒
                </span>

                <span>

                    <strong style="font-size:14px;">
                        Saturday:
                    </strong>

                    ${location.saturdayHours || "Not Available"}

                </span>

            </div>


            <div class="info-row">

                <span class="info-icon">
                    🕒
                </span>

                <span>

                    <strong style="font-size:14px;">
                        Sunday:
                    </strong>

                    ${location.sundayHours || "Not Available"}

                </span>

            </div>


            <hr>


            <div class="info-row">

                <span class="info-icon">
                    📞
                </span>

                <span>

                    <a href="tel:${location.phone}">
                        ${location.phone}
                    </a>

                </span>

            </div>


            <div class="info-row">

                <span class="info-icon">
                    🌐
                </span>

                <span>

                    <a
                        href="${location.website}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Open Website
                    </a>

                </span>

            </div>

        </div>

    `;

}


/* =====================================================
   TOWN SELECTED
   This continues to show all locations in the
   selected town, exactly as before.
===================================================== */

townSelect.addEventListener("change", function() {

    const selectedTown =
        this.value;

    const results =
        document.getElementById("results");


    if (selectedTown === "") {

        results.innerHTML = "";

        return;

    }


    const townLocations =
        locations.filter(function(location) {

            return location.town.toLowerCase() ===
                   selectedTown.toLowerCase();

        });


    let html = `

        <h3>
            📍 Locations in ${selectedTown}
        </h3>

    `;


    townLocations.forEach(function(location) {

        html += createLocationCard(location);

    });


    results.innerHTML = html;

});


/* =====================================================
   USE MY LOCATION
   Finds ONLY:
   - 2 closest Urgent Care locations
   - 2 closest Emergency Rooms
===================================================== */

function getLocation() {

    const resultsDiv =
        document.getElementById("results");


    if (!navigator.geolocation) {

        resultsDiv.innerHTML = `

            <p class="error">

                📍 Your browser does not support
                location services.

            </p>

        `;

        return;

    }


    resultsDiv.innerHTML = `

        <div class="loading">

            <h3>
                📍 Getting your location...
            </h3>

            <p>
                Finding the closest medical locations...
            </p>

        </div>

    `;


    navigator.geolocation.getCurrentPosition(

        function(position) {

            /* -----------------------------------------
               GET ACTUAL GPS LOCATION
            ----------------------------------------- */

            userLocation = {

                lat: position.coords.latitude,

                lon: position.coords.longitude

            };


            /* -----------------------------------------
               HAVERSINE DISTANCE CALCULATION
               Returns distance in miles.
            ----------------------------------------- */

            function calculateDistance(
                lat1,
                lon1,
                lat2,
                lon2
            ) {

                const earthRadius =
                    3958.8;


                const lat1Rad =
                    lat1 * Math.PI / 180;

                const lat2Rad =
                    lat2 * Math.PI / 180;


                const deltaLat =
                    (lat2 - lat1) * Math.PI / 180;

                const deltaLon =
                    (lon2 - lon1) * Math.PI / 180;


                const a =
                    Math.sin(deltaLat / 2) *
                    Math.sin(deltaLat / 2) +

                    Math.cos(lat1Rad) *
                    Math.cos(lat2Rad) *

                    Math.sin(deltaLon / 2) *
                    Math.sin(deltaLon / 2);


                const c =
                    2 * Math.atan2(
                        Math.sqrt(a),
                        Math.sqrt(1 - a)
                    );


                return earthRadius * c;

            }


            /* -----------------------------------------
               CALCULATE DISTANCE FOR EVERY LOCATION
            ----------------------------------------- */

            const locationsWithDistance =
                locations.map(function(location) {

                    return {

                        ...location,

                        distance:
                            calculateDistance(
                                userLocation.lat,
                                userLocation.lon,
                                location.latitude,
                                location.longitude
                            )

                    };

                });


            /* -----------------------------------------
               FIND 2 CLOSEST URGENT CARE
            ----------------------------------------- */

            const closestUrgentCare =
                locationsWithDistance
                    .filter(function(location) {

                        return (
                            location.type ===
                            "Urgent Care"
                        );

                    })
                    .sort(function(a, b) {

                        return (
                            a.distance -
                            b.distance
                        );

                    })
                    .slice(0, 2);


            /* -----------------------------------------
               FIND 2 CLOSEST EMERGENCY ROOMS
            ----------------------------------------- */

            const closestEmergencyRooms =
                locationsWithDistance
                    .filter(function(location) {

                        return (
                            location.type ===
                            "Emergency Room"
                        );

                    })
                    .sort(function(a, b) {

                        return (
                            a.distance -
                            b.distance
                        );

                    })
                    .slice(0, 2);


            /* -----------------------------------------
               BUILD RESULTS
            ----------------------------------------- */

            let html = `

                <h3>
                    📍 Closest Medical Locations
                </h3>

                <p
                    style="
                        text-align:center;
                        color:#5b6875;
                        margin-bottom:25px;
                    "
                >
                    Based on your current GPS location.
                </p>

            `;


            /* -----------------------------------------
               SHOW 2 CLOSEST URGENT CARE
            ----------------------------------------- */

            if (
                closestUrgentCare.length > 0
            ) {

                html += `

                    <h4>
                        Urgent Care
                    </h4>

                `;


                closestUrgentCare.forEach(
                    function(location) {

                        html +=
                            createLocationCardWithDistance(
                                location
                            );

                    }
                );

            }


            /* -----------------------------------------
               SHOW 2 CLOSEST EMERGENCY ROOMS
            ----------------------------------------- */

            if (
                closestEmergencyRooms.length > 0
            ) {

                html += `

                    <h4>
                        Emergency Rooms
                    </h4>

                `;


                closestEmergencyRooms.forEach(
                    function(location) {

                        html +=
                            createLocationCardWithDistance(
                                location
                            );

                    }
                );

            }


                 resultsDiv.innerHTML = html;

            setTimeout(function () {
                resultsDiv.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }, 100);

        },

        /* ---------------------------------------------
           LOCATION ERROR
        --------------------------------------------- */

        function(error) {

            if (error.code === 1) {

                resultsDiv.innerHTML = `

                    <p class="error">

                        📍 Location permission was denied.
                        Please allow location access and try again.

                    </p>

                `;

            }

            else if (error.code === 2) {

                resultsDiv.innerHTML = `

                    <p class="error">

                        📍 Your location could not be determined.
                        Please try again.

                    </p>

                `;

            }

            else if (error.code === 3) {

                resultsDiv.innerHTML = `

                    <p class="error">

                        📍 Location request timed out.
                        Please try again.

                    </p>

                `;

            }

            else {

                resultsDiv.innerHTML = `

                    <p class="error">

                        📍 Unable to get your location.

                    </p>

                `;

            }

        },


        /* ---------------------------------------------
           GPS OPTIONS
        --------------------------------------------- */

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


/* =====================================================
   SAFETY INFORMATION
===================================================== */

function showSafety() {

    document.getElementById("results").innerHTML = `

        <h3>
            🦺 Safety Information
        </h3>


        <div class="location safety-card">

            <p>

                Access the Custom Electric safety manuals
                and Safety Data Sheet documents below.

            </p>


            <p>

                <button
                    class="pdf-button"
                    onclick="showPDF('Safety Manual- Custom Electric Aug 2026.pdf')"
                >

                    📄 Safety Manual

                </button>

            </p>


            <p>

                <button
                    class="pdf-button"
                    onclick="showPDF('Safety Manual Table of Contents- Custom Electric May 2025.pdf')"
                >

                    📄 Safety Manual Table of Contents

                </button>

            </p>


            <p>

                <button
                    class="pdf-button"
                    onclick="showPDF('SDS Sheets- Custom Electric Aug 2026.pdf')"
                >

                    📄 SDS Sheets

                </button>

            </p>


            <div
                id="pdfViewer"
                style="margin-top:20px;"
            ></div>

        </div>

    `;

}


/* =====================================================
   OPEN PDF
===================================================== */

function showPDF(filename) {

    window.open(
        `./safety/${filename}`,
        "_blank"
    );

}

</script>

</body>
</html>
