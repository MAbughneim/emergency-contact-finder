<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Emergency Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #222;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #0078D4;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background: #005a9e;
        }

        #mainSection {
            display: none;
        }

        #results {
            margin-top: 25px;
            text-align: left;
        }

        .location {
            margin-bottom: 20px;
            padding: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f8f8f8;
        }

        .location strong {
            font-size: 18px;
        }

        .location a {
            color: #0078D4;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>


<body>

    <h1>🏥 Medical Emergency Information</h1>


    <!-- LOGIN -->

    <div id="loginSection">

        <p>Enter Company Access Code</p>

        <input
            type="password"
            id="password"
            placeholder="Access Code"
        >

        <button onclick="login()">
            Continue
        </button>

    </div>


    <!-- MAIN -->

    <div id="mainSection">

        <h2>Welcome</h2>

        <button onclick="getLocation()">
            📍 Use My Location
        </button>

        <br><br>


        <!-- TOWN DROPDOWN -->

        <select id="townSelect">

            <option value="">
                Select Town
            </option>

        </select>


        <!-- RESULTS -->

        <div id="results"></div>

    </div>


    <!-- LOAD LOCATIONS.JS ONCE -->

    <script src="locations.js"></script>


    <script>

        // =====================================
        // LOGIN
        // =====================================

        function login() {

            const password =
                document.getElementById("password").value;

            if (password === "EC2026") {

                document.getElementById("loginSection").style.display =
                    "none";

                document.getElementById("mainSection").style.display =
                    "block";

            } else {

                alert("Invalid Access Code");

            }

        }


        // =====================================
        // CHECK LOCATIONS FILE
        // =====================================

        if (typeof locations === "undefined") {

            document.getElementById("results").innerHTML =
                "<p class='error'>ERROR: locations.js was not loaded.</p>";

        }


        // =====================================
        // CREATE TOWN DROPDOWN
        // =====================================

        const townSelect =
            document.getElementById("townSelect");


        if (typeof locations !== "undefined") {

            const towns = [
                ...new Set(
                    locations.map(function(location) {
                        return location.town;
                    })
                )
            ].sort();


            towns.forEach(function(town) {

                const option =
                    document.createElement("option");

                option.value = town;

                option.textContent = town;

                townSelect.appendChild(option);

            });

        }


        // =====================================
        // TOWN SELECTED
        // =====================================

        townSelect.addEventListener("change", function() {

            const selectedTown = this.value;

            const results =
                document.getElementById("results");


            if (selectedTown === "") {

                results.innerHTML = "";

                return;

            }


            if (typeof locations === "undefined") {

                results.innerHTML =
                    "<p class='error'>locations.js is not loaded.</p>";

                return;

            }


            // FIND ALL LOCATIONS IN TOWN

            const townLocations =
                locations.filter(function(location) {

                    return location.town.toLowerCase() ===
                           selectedTown.toLowerCase();

                });


            let html =
                "<h3>📍 Locations in " +
                selectedTown +
                "</h3>";


            if (townLocations.length === 0) {

                html +=
                    "<p>No locations found.</p>";

            }


            // DISPLAY EVERY LOCATION

            townLocations.forEach(function(location) {

                html += `

                    <div class="location">

                        <strong>
                            ${location.name}
                        </strong>

                        <br><br>

                        🏥 ${location.type}

                        <br><br>

                        📍 ${location.address}

                        <br><br>

                        📞
                        <a href="tel:${location.phone}">
                            ${location.phone}
                        </a>

                        <br><br>

                        <a
                            href="${location.website}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            🌐 Open Website
                        </a>

                    </div>

                `;

            });


            results.innerHTML = html;

        });


        // =====================================
        // USE MY LOCATION
        // =====================================

function getLocation() {

    const resultsDiv = document.getElementById("results");

    if (!navigator.geolocation) {
        resultsDiv.innerHTML = `
            <p class="error">
                Your browser does not support location services.
            </p>
        `;
        return;
    }

    if (typeof locations === "undefined") {
        resultsDiv.innerHTML = `
            <p class="error">
                ERROR: locations.js was not loaded.
            </p>
        `;
        return;
    }

    if (!Array.isArray(locations) || locations.length === 0) {
        resultsDiv.innerHTML = `
            <p class="error">
                ERROR: There are no locations in locations.js.
            </p>
        `;
        return;
    }

    resultsDiv.innerHTML = `
        <h3>📍 Finding locations near you...</h3>
        <p>Please wait...</p>
    `;

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;

            console.log("Your latitude:", userLat);
            console.log("Your longitude:", userLon);
            console.log("Locations:", locations);


            // Calculate distance to every location

  const results = locations
.filter(function(location) {

    return !isNaN(parseFloat(location.latitude)) &&
           !isNaN(parseFloat(location.longitude));

})
.map(function(location) {


                .map(function(location) {

                    const R = 3958.8; // Earth radius in miles

                    const lat1 =
                        userLat * Math.PI / 180;

                    const lat2 =
                        location.latitude * Math.PI / 180;

                    const dLat =
                        (location.latitude - userLat)
                        * Math.PI / 180;

                    const dLon =
                        (location.longitude - userLon)
                        * Math.PI / 180;


                    const a =
                        Math.sin(dLat / 2) *
                        Math.sin(dLat / 2) +

                        Math.cos(lat1) *
                        Math.cos(lat2) *
                        Math.sin(dLon / 2) *
                        Math.sin(dLon / 2);


                    const c =
                        2 * Math.atan2(
                            Math.sqrt(a),
                            Math.sqrt(1 - a)
                        );


                    const distance = R * c;


                    return {
                        ...location,
                        distance: distance
                    };

                });


            // Sort closest first

            results.sort(function(a, b) {

                return a.distance - b.distance;

            });


            // Get closest 4

          const urgentCares = results
    .filter(x => x.type === "Urgent Care")
    .slice(0, 2);

const emergencyRooms = results
    .filter(x => x.type === "Emergency Room")
    .slice(0, 2);

const nearest = [
    ...urgentCares,
    ...emergencyRooms
];

let html = `
    <h3>📍 Closest Emergency Locations</h3>

    <h4>Urgent Care</h4>
`;



            if (nearest.length === 0) {

                html += `
                    <p class="error">
                        No locations with valid coordinates were found.
                    </p>
                `;

            }


            nearest.forEach(function(location) {

                html += `

                    <div class="location">

                        <strong>
                            ${location.name}
                        </strong>

                        <br><br>

                        🏥 ${location.type}

                        <br><br>

                        📍 ${location.address}

                        <br><br>

                        📏
                        ${location.distance.toFixed(1)}
                        miles away

                        <br><br>

                        📞
                        <a href="tel:${location.phone}">
                            ${location.phone}
                        </a>

                        <br><br>

                        <a
                            href="${location.website}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            🌐 Open Website
                        </a>

                    </div>

                `;

            });


            resultsDiv.innerHTML = html;

        },


        function(error) {

            if (error.code === 1) {

                resultsDiv.innerHTML = `
                    <p class="error">
                        📍 Location permission was denied.
                        Please allow location access and try again.
                    </p>
                `;

            }

            else if (error.code === 2) {

                resultsDiv.innerHTML = `
                    <p class="error">
                        📍 Your location could not be determined.
                        Please try again.
                    </p>
                `;

            }

            else if (error.code === 3) {

                resultsDiv.innerHTML = `
                    <p class="error">
                        📍 Location request timed out.
                        Please try again.
                    </p>
                `;

            }

            else {

                resultsDiv.innerHTML = `
                    <p class="error">
                        📍 Unable to get your location.
                    </p>
                `;

            }

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );
}

    </script>

</body>

</html>
